<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4fa">
<title>Aria's Store ♡ Fazer pedido</title>
<style>
:root{--pink:#e8b8d2;--pink-dark:#a85e85;--pink-light:#fff4fa;--ink:#68475a;--line:#f0d7e5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(150deg,#fff9fc,#fceaf4);font-family:Arial,Helvetica,sans-serif;color:var(--ink);padding:24px 14px}
.wrap{max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 12px 35px #dba9c522}
.hero{text-align:center;padding:30px 22px 24px;background:radial-gradient(circle at top,#fff 0,#fff4fa 75%)}
.bow{font-size:28px;color:var(--pink-dark);letter-spacing:5px}
h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(30px,8vw,42px);margin:10px 0 7px;color:#b66d93}
.subtitle{font-size:14px;line-height:1.6;margin:0;color:#9c7a8d}
.ribbon{height:5px;background:linear-gradient(90deg,#fff,#e8b8d2,#fff)}
form{padding:24px 22px 26px}
.field{margin-bottom:18px}
label{display:block;font-weight:700;font-size:13px;margin-bottom:8px;color:#865c73}
input,select,textarea{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:15px Arial,sans-serif;color:var(--ink);background:#fffafd;outline:none}
input:focus,select:focus,textarea:focus{border-color:#d99bbc;box-shadow:0 0 0 3px #fceaf4}
textarea{min-height:105px;resize:vertical}
.hint{font-size:12px;line-height:1.5;color:#a18495;margin-top:7px}
button{width:100%;border:0;border-radius:14px;padding:15px 18px;background:#e8b8d2;color:#633d53;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 5px 0 #d8a2bf}
button:hover{background:#efc8dc}
button:active{transform:translateY(2px);box-shadow:0 3px 0 #d8a2bf}
.foot{text-align:center;padding:0 22px 23px;font-size:12px;color:#a18495;line-height:1.6}
.heart{color:#ce8eb0}
@media(min-width:520px){body{padding-top:42px}.hero{padding-top:36px}form{padding:28px 32px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <header class="hero">
      <div class="bow">୨୧ ♡ ୨୧</div>
      <h1>Aria's Store</h1>
      <p class="subtitle">seu pedido começa aqui ✧<br>Preencha os detalhes para encomendar algo feito especialmente para você.</p>
    </header>
    <div class="ribbon"></div>
    <form id="orderForm">
      <div class="field">
        <label for="name">♡ Seu nome ou @</label>
        <input id="name" name="name" placeholder="Como podemos te chamar?" required maxlength="80">
      </div>
      <div class="field">
        <label for="service">♡ O que você deseja encomendar?</label>
        <select id="service" name="service" required>
          <option value="" disabled selected>Escolha um serviço</option>
          <option>GFX</option><option>Edit</option><option>Card</option><option>Banner / capa</option><option>Outro</option>
        </select>
      </div>
      <div class="field">
        <label for="inspiration">♡ Inspiração ou referência</label>
        <input id="inspiration" name="inspiration" placeholder="Link, nome ou ideia (se tiver)">
      </div>
      <div class="field">
        <label for="details">♡ Como você quer seu pedido?</label>
        <textarea id="details" name="details" placeholder="Conte as cores, o estilo, o texto e outros detalhes..." required maxlength="1200"></textarea>
      </div>
      <div class="field">
        <label for="deadline">♡ Prazo desejado (opcional)</label>
        <input id="deadline" name="deadline" placeholder="Ex.: até sexta-feira">
      </div>
      <button type="submit">♡ Enviar pedido pelo WhatsApp ♡</button>
      <p class="hint">Ao tocar no botão, o WhatsApp abrirá com sua mensagem pronta. Confira e toque em enviar por lá.</p>
    </form>
    <footer class="foot">Feito com carinho <span class="heart">♡</span> Aria's Store<br>Obrigada por apoiar nossa lojinha!</footer>
  </section>
</main>
<script>
document.getElementById('orderForm').addEventListener('submit', function(e){
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim() || 'Não informado';
  const message = [
    "୨୧ *NOVO PEDIDO — ARIA'S STORE* ୨୧",
    "",
    "*Nome/@:* " + v('name'),
    "*Serviço:* " + v('service'),
    "*Inspiração/referência:* " + v('inspiration'),
    "*Detalhes do pedido:* " + v('details'),
    "*Prazo desejado:* " + v('deadline'),
    "",
    "Oi! Vim pelo formulário da Aria's Store ♡"
  ].join("\n");
  const url = "https://wa.me/5598985104005?text=" + encodeURIComponent(message);
  window.open(url, "_blank", "noopener,noreferrer");
});
</script>
</body>
</html>
